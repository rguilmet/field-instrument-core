sentence=Shared ESP32-S3 BSP, I2C recovery, display, audio, storage, BLE companion (FICP), web portal, sensor drivers, and 9-DOF AHRS core for Waveshare field instruments.
paragraph=Provides parameterized dual-bus I2C bus recovery, TCA9554 IO expander, AXS15231B QSPI LVGL port with PSRAM extmem wrapping and lock-free BMP screenshots, ES8311/ES7210 audio codec and Priority-4 beeper, PSRAM ring loggers, task-scoped console logger, atomic JSON config persistence, FICP BLE 5.0 companion engine with Wi-Fi mutual exclusion, Wi-Fi STA/SoftAP file portal, QMI8658 IMU, SEN0696 10-DOF beam IMU, MMC5983MA magnetometer, PCF85063 RTC, AXP2101 PMIC, 9-DOF Madgwick AHRS, matrix math, and Waveshare ESP32-S3 board profiles.
